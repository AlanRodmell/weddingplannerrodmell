<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&display=swap">
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<title>Wedding Planner</title>
<style>
:root{--bg:#fbf6ef;--glow:#f6e3d0;--card:#fffdf9;--tx:#3b2f2a;--mut:#9a8a7c;--ac:#b4573a;--acx:#fffaf5;--soft:#f7e9dc;--sage:#7d8f5c;--ln:#eadfd1;--red:#b03a2e;--grn:#6b7f4e;--amb:#c88a32;--sh:0 1px 2px #6b4a3012,0 6px 18px #6b4a3010;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231b17;--glow:#35261e;--card:#2d231f;--tx:#f3e8dc;--mut:#b3a191;--ac:#e08a63;--acx:#231b17;--soft:#3b2d26;--sage:#a3b57f;--ln:#43352e;--red:#ef8a7d;--grn:#a3b57f;--amb:#e5ad57;--sh:0 1px 2px #0005,0 6px 18px #0003}}
:root[data-theme="dark"]{--bg:#231b17;--glow:#35261e;--card:#2d231f;--tx:#f3e8dc;--mut:#b3a191;--ac:#e08a63;--acx:#231b17;--soft:#3b2d26;--sage:#a3b57f;--ln:#43352e;--red:#ef8a7d;--grn:#a3b57f;--amb:#e5ad57;--sh:0 1px 2px #0005,0 6px 18px #0003}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:400 16px/1.5 var(--sans);background:radial-gradient(120% 55% at 50% 0%,var(--glow),var(--bg) 70%) no-repeat,var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:24px 16px 110px}
header{text-align:center;margin-bottom:20px;position:relative}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.icon-btn{background:var(--card);border:1px solid var(--ln);color:var(--mut);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .15s;box-shadow:var(--sh)}
.icon-btn:hover{color:var(--ac);border-color:var(--ac)}
h1{font:500 36px/1.1 var(--serif);letter-spacing:.01em;margin:0}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ac);margin:6px 0;font-size:13px}
.orn:before,.orn:after{content:"";height:1px;width:48px;background:linear-gradient(90deg,transparent,var(--ac))}
.orn:after{transform:scaleX(-1)}
.sub{color:var(--mut);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
header .sub{margin:0}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:99px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border:0;background:transparent;color:var(--mut);border-radius:99px;font:500 15px var(--sans);letter-spacing:.04em;transition:all .2s;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{padding-left:36px;padding-right:32px;border-radius:99px;background:var(--card);font-size:14px;height:40px}
.search-wrap .s-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}
.search-wrap .s-clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px;padding:4px;display:none}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--sh);transition:transform .15s,border-color .15s;cursor:pointer}
.row:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--ln))}
.row:active{transform:scale(.995);border-color:var(--ac)}
.row .b{flex:1;min-width:0}
.row .t{font:500 20px/1.2 var(--serif);overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.done{opacity:.58}.done .t{text-decoration:line-through;text-decoration-thickness:1px}
.over{color:var(--red)!important;font-weight:500}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:1.5px solid var(--ac);border-radius:50%;background:transparent;flex:none;display:grid;place-content:center;transition:all .2s;cursor:pointer}
input[type=checkbox]:checked{background:var(--sage);border-color:var(--sage)}
input[type=checkbox]:checked:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 14px;border:1px solid var(--ln);border-radius:99px;background:var(--card);color:var(--mut);font:400 13.5px var(--sans);transition:all .2s;cursor:pointer}
.chip.add{border-style:dashed;color:var(--ac);border-color:var(--ac)}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.bell{text-decoration:none;font-size:19px;padding:6px;flex:none;opacity:.85;transition:transform .15s}
.bell:hover{transform:scale(1.12);opacity:1}
.hint{font-size:13px;color:var(--mut);text-align:center;margin-top:16px}
.sec{font:500 23px var(--serif);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font:400 13px var(--sans);color:var(--mut)}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.mp{padding:4px 12px;font-size:12px;color:var(--ac);border-color:var(--ac);cursor:pointer}
.amt{font:500 20px var(--serif);color:var(--ac)}
.lg{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.so{display:none;font-size:11px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.grip{color:var(--mut);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:8px 2px 8px 0;flex:none;display:flex}
.row.drag{box-shadow:0 14px 32px #0005;transform:scale(1.02);border-color:var(--ac);position:relative;z-index:2}
.badge{display:inline-block;font:500 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;background:var(--soft);color:var(--ac);padding:2px 8px;border-radius:99px;vertical-align:middle}
.badge.sage{background:color-mix(in srgb,var(--sage) 18%,transparent);color:var(--grn)}
.badge.amb{background:color-mix(in srgb,var(--amb) 20%,transparent);color:var(--amb)}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cap{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.cap .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.cap .n{font:500 32px/1.1 var(--serif);margin:4px 0 0;color:var(--tx)}
.cap .n small{font-size:17px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex;margin:10px 0 8px}
.bar i{display:block;height:100%;transition:width .3s ease}
.bar .ok{background:var(--sage)}.bar .pe{background:var(--ac);opacity:.55}.bar .es{background:var(--amb);opacity:.55}
.cap.over .n{color:var(--red)}.cap.over .bar .ok{background:var(--red)}
.cap .m{font-size:12.5px;color:var(--mut)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acx);border:0;border-radius:99px;padding:14px 24px;font:500 16px var(--sans);letter-spacing:.04em;box-shadow:0 8px 24px #b4573a55;transition:transform .15s;cursor:pointer;z-index:5}
.fab:active{transform:scale(.96)}
.btn{padding:9px 16px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;font:500 14px var(--sans);transition:all .15s;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn.d{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font:500 24px/1.15 var(--serif);color:var(--ac)}
.stat span{font-size:10.5px;color:var(--mut);letter-spacing:.11em;text-transform:uppercase}
select,input,textarea{font:400 16px var(--sans);color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input[type=checkbox]{width:24px;padding:0}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #b4573a22}
.rsvp{width:auto;padding:6px 10px;border-radius:99px;background:var(--soft);font-size:13.5px;cursor:pointer}
#modal{position:fixed;inset:0;background:#3b2f2a66;backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:15}
#modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h1{font-size:28px;margin-bottom:4px}
.sheet label{display:block;font-size:11.5px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin:13px 0 5px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:20px}.acts .p{flex:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 4px;border-bottom:1px solid var(--ln);text-align:right}td:first-child,th:first-child{text-align:left}
th{font-weight:500;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px;overflow-x:auto;box-shadow:var(--sh)}
.note{background:var(--soft);border-radius:16px;padding:18px;color:var(--mut);font:italic 400 18px var(--serif);text-align:center}
.sub a{color:var(--ac);text-decoration:none}
.sub a:hover{text-decoration:underline}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mini-box{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--card);padding:9px 18px;border-radius:99px;display:none;z-index:30;font-size:14px;box-shadow:var(--sh)}
</style>
</head>
<body>
<main>
  <header>
    <div class="top-bar">
      <div style="display:flex;gap:6px">
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
        <button class="icon-btn" id="cfgBtn" title="Wedding settings" aria-label="Wedding settings">⚙</button>
      </div>
      <a href="#" id="signout" class="so">Sign out</a>
      <button class="icon-btn" id="expBtn" title="Export / Backup data" aria-label="Export data">⤓</button>
    </div>
    <h1 id="wtitle">Our Wedding</h1>
    <div class="orn">❦</div>
    <div class="sub" id="count"></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="search-wrap">
    <span class="s-ic">🔍</span>
    <input id="search" type="search" placeholder="Search tasks, guests, or costs...">
    <button class="s-clr" id="sclr" aria-label="Clear search">✕</button>
  </div>
  <div id="view"></div>
</main>
<button class="fab" id="fab"></button>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="login" class="lg"><div class="sheet" style="border-radius:24px;max-width:360px">
  <h1>Our Wedding</h1><div class="orn">❦</div>
  <label>Email</label><input id="lem" type="email" autocomplete="username">
  <label>Password</label><input id="lpw" type="password" autocomplete="current-password">
  <div class="acts"><button class="btn p" id="lgo">Sign in</button></div><p id="lerr" class="hint"></p></div></div>
<div id="toast"></div>
<script>
const DEFAULT_WEDDING = '2027-10-02';
const DEFAULT_CATS = ['Venue','Catering','Attire','Photography','Music','Flowers','Stationery','Travel','Other'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = n => '£' + (Number(n)||0).toLocaleString('en-GB', {minimumFractionDigits: (Number(n)%1 !== 0 ? 2 : 0), maximumFractionDigits:2});
const st = {tasks:[], guests:[], cats:[], exps:[], cfg:{}};
let db = null, tab = 'tasks', filter = 'all', gfilter = 'all', sfilter = 'all', dfilter = false, hideDone = false, qSearch = '', drag = null, pendingRender = false;
const loaded = {cats:false, cfg:false};
let seeded = false;

// Theme setup
const savedTheme = localStorage.getItem('wp_theme') || '';
if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if(next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('wp_theme', next);
  toast(next ? `Theme: ${next}` : 'Theme: auto');
};

function toast(m){
  const t=$('#toast'); t.textContent=m; t.style.display='block';
  clearTimeout(toast. tid);
  toast.tid = setTimeout(()=>t.style.display='none',3200);
}

async function save(col, id, data){
  if(!db){ toast('Not connected: changes are not being saved'); return null; }
  try{
    if(id){ await db.doc(col+'/'+id).set(data); return id; }
    else { const ref = await db.collection(col).add(data); return ref.id; }
  } catch(e){
    toast(e && e.code === 'permission-denied' ? 'This account is not allowed to save' : 'Save failed');
    return null;
  }
}
async function remove(col, id){
  if(!db) return;
  try{ await db.doc(col+'/'+id).delete(); }catch(e){ toast('Delete failed'); }
}

// Automatically sync a task's estimated cost with the Budget expenses list
async function syncTaskEstimateToBudget(taskId, taskData, autoSyncEnabled = true){
  if(!db || !taskId || !autoSyncEnabled) return;
  const est = parseFloat(taskData.est) || 0;
  const linked = st.exps.filter(x => x.taskId === taskId);
  const autoExp = linked.find(x => x.autoEst);

  if(est > 0){
    if(autoExp){
      // Update existing auto-generated budget entry if it hasn't been paid yet
      if(!isPaid(autoExp)){
        const {id, ...rest} = autoExp;
        await save('expenses', id, {
          ...rest,
          desc: taskData.title,
          amount: est,
          due: taskData.due || rest.due || '',
          cat: taskData.cat || ''
        });
      }
    } else if(linked.length === 0){
      // Create a fresh linked budget costing entry automatically
      await save('expenses', null, {
        desc: taskData.title,
        amount: est,
        status: 'due',
        due: taskData.due || '',
        paidOn: '',
        taskId: taskId,
        cat: taskData.cat || '',
        autoEst: true
      });
      toast('Estimated cost added to Budget');
    }
  } else if(est === 0 && autoExp && !isPaid(autoExp)){
    // If estimate was cleared to 0 and auto-expense is unpaid, remove the auto-expense
    await remove('expenses', autoExp.id);
  }
}

function sub(col, key){
  unsubs.push(db.collection(col).onSnapshot(s => {
    st[key] = s.docs.map(d => ({id:d.id, ...d.data()}));
    if(key==='cats' && !s.metadata.fromCache){ loaded.cats = true; maybeSeed(); }
    render();
  }, () => toast('Sync problem')));
}
function maybeSeed(){
  if(seeded || !loaded.cats || !loaded.cfg) return;
  if(st.cats.length === 0 && !st.cfg.seeded){
    seeded = true;
    DEFAULT_CATS.forEach((n,i) => save('categories', 'c'+i, {name:n}));
    save('settings', 'main', {...st.cfg, seeded:true});
  }
}

const firebaseConfig = {
  apiKey: "AIzaSyBtGucs0GdY_AtjrQJFruUWF3rilDyyyLw",
  authDomain: "weddingplannerrodmell.firebaseapp.com",
  projectId: "weddingplannerrodmell",
  storageBucket: "weddingplannerrodmell.firebasestorage.app",
  messagingSenderId: "976090623670",
  appId: "1:976090623670:web:4a19af2d31e485d5b54017"
};
let unsubs = [];
function connect(){
  if(firebaseConfig.apiKey.startsWith('PASTE')){ $('#view').innerHTML = '<div class="note">Add your Firebase settings at the top of this file.</div>'; return; }
  if(typeof firebase === 'undefined'){ $('#view').innerHTML = '<div class="note">Could not load Firebase. Check your connection and reload.</div>'; return; }
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth(); db = firebase.firestore();
  const go = () => { $('#lerr').textContent = ''; auth.signInWithEmailAndPassword($('#lem').value.trim(), $('#lpw').value).catch(() => $('#lerr').textContent = 'Could not sign in. Check your email and password.'); };
  $('#lgo').onclick = go;
  $('#lpw').onkeydown = e => { if(e.key === 'Enter') go(); };
  $('#signout').onclick = e => { e.preventDefault(); auth.signOut(); };
  auth.onAuthStateChanged(u => {
    unsubs.forEach(f => f()); unsubs = []; loaded.cats = false; loaded.cfg = false; seeded = false;
    if(!u){
      st.tasks = []; st.guests = []; st.cats = []; st.exps = []; st.cfg = {};
      $('#login').style.display = 'flex'; $('#signout').style.display = 'none'; render(); return;
    }
    $('#login').style.display = 'none'; $('#signout').style.display = 'inline-block';
    sub('tasks','tasks'); sub('guests','guests'); sub('categories','cats'); sub('expenses','exps');
    unsubs.push(db.doc('settings/main').onSnapshot(s => {
      st.cfg = s.exists ? s.data() : {};
      if(!s.metadata.fromCache){ loaded.cfg = true; maybeSeed(); }
      render();
    }, () => toast('Sync problem')));
  });
}

const catName = id => (st.cats.find(c => c.id === id) || {}).name || 'Uncategorised';
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => {
  if(!d) return '';
  const [y,m,day] = d.split('-');
  if(!y||!m||!day) return d;
  const dt = new Date(Number(y), Number(m)-1, Number(day));
  return isNaN(dt) ? d : dt.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
};

function render(){
  if(drag){ pendingRender = true; return; }
  const wDate = st.cfg.weddingDate || DEFAULT_WEDDING;
  const wTitle = st.cfg.weddingTitle || 'Our Wedding';
  $('#wtitle').textContent = wTitle;
  const days = Math.ceil((new Date(wDate) - new Date(today())) / 864e5);
  const niceDate = fmtDate(wDate);
  $('#count').textContent = days > 0 ? `${days} days to go · ${niceDate}` : days === 0 ? `Today is the day! · ${niceDate}` : niceDate;

  const openCnt = st.tasks.filter(t=>!t.done).length;
  const yesCnt = st.guests.filter(g=>(g.rsvp||'pending')==='yes').reduce((a,g)=>a+(Number(g.size)||1),0);
  const dueCnt = st.exps.filter(x=>!isPaid(x)).length;

  $('#tabs').innerHTML = [
    ['tasks', `Tasks (${openCnt})`],
    ['guests', `Guests (${yesCnt})`],
    ['budget', `Budget${dueCnt ? ` (${dueCnt})` : ''}`]
  ].map(([k,l]) => `<button class="${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');

  $('#fab').textContent = tab==='tasks' ? '+ Task' : tab==='guests' ? '+ Guest' : '+ Cost';
  if(catOpen && catModal.redraw && !(document.activeElement && document.activeElement.dataset.cr !== undefined)) catModal.redraw();
  $('#view').innerHTML = tab==='tasks' ? tasksView() : tab==='guests' ? guestsView() : budgetView();
}

// Search input handlers
$('#search').addEventListener('input', e => {
  qSearch = e.target.value.trim().toLowerCase();
  $('#sclr').style.display = qSearch ? 'block' : 'none';
  render();
});
$('#sclr').onclick = () => {
  $('#search').value = ''; qSearch = ''; $('#sclr').style.display = 'none'; render();
};

const p2 = n => String(n).padStart(2,'0');
const stamp = d => d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';
function remindAt(t){
  if(t.rcustom){ const d = new Date(t.rcustom); return isNaN(d) ? null : d; }
  if(!t.due) return null;
  const days = parseInt(t.rdays !== undefined && t.rdays !== '' ? t.rdays : (st.cfg.rdays ?? 1)) || 0;
  const [h,m] = (t.rtime || st.cfg.rtime || '09:00').split(':').map(Number);
  const [y,mo,d] = t.due.split('-').map(Number);
  return new Date(y, mo-1, d-days, h||0, m||0);
}
function calLink(t){
  const at = remindAt(t); if(!at) return '';
  const end = new Date(at.getTime() + 15*60000);
  const det = ['Wedding task' + (t.due ? ' due ' + t.due : ''), catName(t.cat), t.notes].filter(Boolean).join('\n');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Wedding: ' + t.title)
    + '&dates=' + stamp(at) + '/' + stamp(end) + '&details=' + encodeURIComponent(det);
}
const bell = t => { const u = !t.done && calLink(t); return u ? `<a class="bell" href="${esc(u)}" target="_blank" rel="noopener" aria-label="Add reminder to Google Calendar" title="Add reminder to Google Calendar">🔔</a>` : ''; };

const effOrder = t => t.order ?? (t.due ? new Date(t.due).getTime() - 4e12 : -1e12);
const byOrder = (a,b) => effOrder(a) - effOrder(b) || String(a.id).localeCompare(String(b.id));
const GRIP = '<svg width="16" height="22" viewBox="0 0 16 22" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="4" r="1.8"/><circle cx="11" cy="4" r="1.8"/><circle cx="5" cy="11" r="1.8"/><circle cx="11" cy="11" r="1.8"/><circle cx="5" cy="18" r="1.8"/><circle cx="11" cy="18" r="1.8"/></g></svg>';

function taskCostBadges(t){
  const mine = st.exps.filter(x => x.taskId === t.id);
  const paid = sumX(mine.filter(isPaid));
  const due = sumX(mine.filter(x => !isPaid(x)));
  const out = [];
  if(paid) out.push(`<span class="badge sage">${gbp(paid)} paid</span>`);
  if(due) out.push(`<span class="badge">${gbp(due)} to pay</span>`);
  if(!paid && !due && Number(t.est)) out.push(`<span class="badge amb">${gbp(t.est)} est</span>`);
  return out.join(' ');
}

function taskRow(t){
  const over = !t.done && t.due && t.due < today();
  return `<div class="row ${t.done?'done':''}" data-edit="${esc(t.id)}">
    ${t.done ? '' : `<span class="grip" aria-label="Drag to reorder">${GRIP}</span>`}

    <div class="b"><div class="t">${esc(t.title)}</div>

function tasksView(){
  const chips = [['all','All'], ...st.cats.map(c => [c.id, c.name])]
    .map(([k,l]) => `<button class="chip ${filter===k?'on':''}" data-filter="${esc(k)}">${esc(l)}</button>`).join('')
    + `<button class="chip add" data-cats>＋ Category</button>`;

  const matchSearch = t => !qSearch || [t.title, t.notes, catName(t.cat)].some(v => String(v||'').toLowerCase().includes(qSearch));
  const vis = st.tasks.filter(t => (filter==='all' || t.cat===filter) && !(hideDone && t.done) && matchSearch(t));
  const openL = vis.filter(t => !t.done).sort(byOrder), doneL = vis.filter(t => t.done).sort(byOrder);
  const rows = vis.length ? `<div id="olist">${openL.map(taskRow).join('')}</div>${doneL.map(taskRow).join('')}`
    : `<div class="note">${qSearch ? 'No tasks match your search.' : 'No tasks yet. Tap + Task to add one.'}</div>`;
  const open = st.tasks.filter(t=>!t.done).length;
  const doneCnt = st.tasks.length - open;
  const pct = st.tasks.length ? Math.round((doneCnt / st.tasks.length)*100) : 0;

  return `<div class="chips">${chips}</div>
    <div class="sub">${open} open · ${doneCnt} done (${pct}%) · <a href="#" data-hide>${hideDone?'show':'hide'} done</a> · <a href="#" data-sortdate>sort by date</a></div>
    ${rows}
    ${st.tasks.length?'<p class="hint">Tasks with an estimated cost automatically sync to your Budget. Drag handles to reorder.</p>':''}`;
}

function commitOrder(ids){
  const all = st.tasks.filter(t => !t.done).sort(byOrder), base = {};
  all.forEach((t,i) => base[t.id] = (i+1)*1000);
  const slots = ids.map(id => base[id]).sort((a,b) => a-b), next = {...base};
  ids.forEach((id,i) => next[id] = slots[i]);
  all.forEach(t => { if(t.order !== next[t.id]){ const {id, ...rest} = t; save('tasks', id, {...rest, order: next[t.id]}); } });
}

function guestsView(){
  const sz = g => Number(g.size)||1, rs = g => g.rsvp||'pending', isE = g => g.invite === 'evening';
  const cnt = f => st.guests.filter(f).reduce((a,g) => a + sz(g), 0);
  const dayLim = Number(st.cfg.dayLimit) || 90, eveLim = Number(st.cfg.eveLimit) || 100;
  const cap = (label, lim, yes, pe) => {
    const over = yes > lim, risk = !over && yes + pe > lim;
    const yp = Math.min(100, yes/lim*100), pp = Math.max(0, Math.min(100 - yp, pe/lim*100));
    const note = over ? `${yes-lim} over the limit` : risk ? `${yes+pe-lim} over if all pending say yes` : `${lim-yes} spaces left`;
    return `<div class="cap ${over?'over':''}"><div class="l">${label}</div><div class="n">${yes} <small>/ ${lim}</small></div>
      <div class="bar"><i class="ok" style="width:${yp}%"></i><i class="pe" style="width:${pp}%"></i></div>
      <div class="m">${pe ? '+' + pe + ' pending · ' : ''}<span class="${over||risk?'over':''}">${note}</span></div></div>`;
  };
  const caps = `<div class="caps">${cap('Day guests', dayLim, cnt(g => rs(g)==='yes' && !isE(g)), cnt(g => rs(g)==='pending' && !isE(g)))}
    ${cap('Evening total', eveLim, cnt(g => rs(g)==='yes'), cnt(g => rs(g)==='pending'))}</div>
    <div class="sub">Evening includes day guests · <a href="#" data-limits>edit limits</a></div>`;

  const SIDES = [['bride','Bride'],['groom','Groom'],['','Mutual / Not set']];
  const sideRows = SIDES.map(([k,l]) => {
    const f = g => (g.side||'') === k;
    const inv = cnt(f); if(!inv) return '';
    return `<tr><td>${l}</td><td>${inv}</td><td>${cnt(g => f(g) && rs(g)==='yes')}</td><td>${cnt(g => f(g) && rs(g)==='pending')}</td><td>${cnt(g => f(g) && rs(g)==='no')}</td></tr>`;
  }).join('');
  const table = st.guests.length ? `<div class="card"><table><tr><th>Invited by</th><th>Invited</th><th>Yes</th><th>Pending</th><th>No</th></tr>${sideRows}
    <tr><td><b>Total</b></td><td><b>${cnt(()=>true)}</b></td><td><b>${cnt(g=>rs(g)==='yes')}</b></td><td><b>${cnt(g=>rs(g)==='pending')}</b></td><td><b>${cnt(g=>rs(g)==='no')}</b></td></tr></table></div>` : '';

  const chip = (attr, cur, k, l) => `<button class="chip ${cur===k?'on':''}" ${attr}="${k}">${l}</button>`;
  const chips = `<div class="chips">${[['all','Everyone'],['bride','Bride'],['groom','Groom']].map(([k,l]) => chip('data-sfilter', sfilter, k, l)).join('')}</div>
    <div class="chips">${[['all','All invites'],['day','Day & evening'],['evening','Evening only']].map(([k,l]) => chip('data-gfilter', gfilter, k, l)).join('')}
    <button class="chip ${dfilter?'on':''}" data-dfilter="1">🥗 Has dietary / table</button></div>`;

  const row = g => `<div class="row" data-gedit="${esc(g.id)}"><div class="b"><div class="t">${esc(g.name)}${sz(g)>1?' (+'+(sz(g)-1)+')':''} ${isE(g)?'<span class="badge">Evening</span>':''}</div>
    <div class="m">
      ${g.table ? `<span class="badge sage">Table: ${esc(g.table)}</span>` : ''}
      ${g.diet ? `<span class="badge amb">🥗 ${esc(g.diet)}</span>` : ''}
      ${g.notes ? `<span>${esc(g.notes)}</span>` : ''}
    </div></div>
    <select class="rsvp" data-rsvp="${esc(g.id)}">${['pending','yes','no'].map(v=>`<option value="${v}" ${rs(g)===v?'selected':''}>${v}</option>`).join('')}</select></div>`;

  const byName = (a,b) => (a.name||'').localeCompare(b.name||'');
  const matchSearch = g => !qSearch || [g.name, g.notes, g.diet, g.table].some(v => String(v||'').toLowerCase().includes(qSearch));
  const list = st.guests.filter(g =>
    (sfilter==='all' || (g.side||'')===sfilter) &&
    (gfilter==='all' || (gfilter==='evening') === isE(g)) &&
    (!dfilter || g.diet || g.table) &&
    matchSearch(g)
  );
  let rows;
  if(!list.length) rows = `<div class="note">${qSearch ? 'No guests match your search.' : 'No guests here yet. Tap + Guest to add one.'}</div>`;
  else if(sfilter !== 'all' || qSearch) rows = list.sort(byName).map(row).join('');
  else rows = SIDES.map(([k,l]) => {
    const gs = list.filter(g => (g.side||'') === k).sort(byName);
    return gs.length ? `<div class="sec"><span>${l}</span><small>${gs.reduce((a,g)=>a+sz(g),0)} guests</small></div>${gs.map(row).join('')}` : '';
  }).join('');
  return caps + table + chips + rows;
}

const isPaid = x => (x.status || 'paid') === 'paid';
const xDate = x => isPaid(x) ? (x.paidOn || x.due || x.date || '') : (x.due || x.date || '');
const isOver = x => !isPaid(x) && xDate(x) && xDate(x) < today();
const amt = x => Number(x.amount) || 0;
const sumX = list => list.reduce((a,x) => a + amt(x), 0);

// Returns tasks that have an estimated cost > 0 but NO expenses linked in st.exps yet
function unlinkedEstTasks(){
  return st.tasks.filter(t => (Number(t.est)||0) > 0 && !st.exps.some(x => x.taskId === t.id));
}

function xrow(x){
  const tk = st.tasks.find(t => t.id === x.taskId), paid = isPaid(x), d = xDate(x);
  return `<div class="row" data-xedit="${esc(x.id)}"><div class="b"><div class="t">${esc(x.desc)} ${x.autoEst && !paid ? '<span class="badge amb">Task est.</span>' : ''}</div>
    <div class="m">
      <span class="${isOver(x)?'over':''}">${paid?'Paid ':'Due '}${esc(d?fmtDate(d):'(no date)')}</span>
      <span>· ${esc(catName(x.cat || (tk && tk.cat)))}</span>
      ${tk && tk.title !== x.desc ? `<span>· 🔗 ${esc(tk.title)}</span>` : ''}
    </div></div>
    <div class="r"><div class="amt">${gbp(x.amount)}</div>${paid?'':`<button class="btn mp" data-paid="${esc(x.id)}">Mark paid</button>`}</div></div>`;
}

function budgetView(){
  const num = v => Number(v)||0, ex = st.exps;
  const tot = num(st.cfg.budget);
  const paid = sumX(ex.filter(isPaid));
  const due = sumX(ex.filter(x=>!isPaid(x)));
  const over = sumX(ex.filter(isOver));
  const unlinkedTasks = unlinkedEstTasks();
  const unlinkedEst = unlinkedTasks.reduce((a,t) => a + num(t.est), 0);
  const totalEst = st.tasks.reduce((a,t)=>a+num(t.est),0);

  // Projected total includes paid + to pay + any unlinked task estimates
  const projected = paid + due + unlinkedEst;
  const remaining = tot - projected;

  // Progress bar percentages
  const denom = Math.max(tot, projected, 1);
  const pPaid = Math.min(100, (paid / denom) * 100);
  const pDue = Math.min(100 - pPaid, (due / denom) * 100);
  const pEst = Math.min(100 - pPaid - pDue, (unlinkedEst / denom) * 100);

  const rows = [...st.cats.map(c=>c.id), ''].map(id => {
    const inCat = c => id ? c===id : !st.cats.some(k=>k.id===c);
    const e = st.tasks.filter(t=>inCat(t.cat)).reduce((a,t)=>a+num(t.est),0);
    const mine = ex.filter(x=>inCat(x.cat)), p = sumX(mine.filter(isPaid)), d = sumX(mine.filter(x=>!isPaid(x)));
    return e||p||d ? `<tr><td>${esc(id?catName(id):'Uncategorised')}</td><td>${gbp(e)}</td><td>${gbp(p)}</td><td>${gbp(d)}</td></tr>` : '';
  }).join('');

  const matchSearch = x => {
    if(!qSearch) return true;
    const tk = st.tasks.find(t => t.id === x.taskId);
    return [x.desc, catName(x.cat), tk && tk.title].some(v => String(v||'').toLowerCase().includes(qSearch));
  };

  const toPay = ex.filter(x=>!isPaid(x) && matchSearch(x)).sort((a,b)=>(xDate(a)||'9999').localeCompare(xDate(b)||'9999')).map(xrow).join('');
  const done = ex.filter(x=>isPaid(x) && matchSearch(x)).sort((a,b)=>xDate(b).localeCompare(xDate(a))).map(xrow).join('');
  const none = '<div class="note">Nothing here yet.</div>';

  const syncBanner = unlinkedTasks.length ? `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft)">
    <div><b style="font-family:var(--serif);font-size:18px">${unlinkedTasks.length} task${unlinkedTasks.length>1?'s':''} with unsynced estimates (${gbp(unlinkedEst)})</b>
    <div class="m">Sync them into your "To pay" budget list automatically.</div></div>
    <button class="btn p" data-syncall>Sync to Budget</button>
  </div>` : '';

  return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="sub" style="margin:0">Budget Projection</span>
        <span style="font-size:13px;color:var(--mut)">${tot ? Math.round((projected/tot)*100)+'% of '+gbp(tot) : 'No budget cap set'}</span>
      </div>
      <div class="bar" style="height:10px;margin:10px 0"><i class="ok" style="width:${pPaid}%"></i><i class="pe" style="width:${pDue}%"></i><i class="es" style="width:${pEst}%"></i></div>
      <div class="legend">
        <span><i style="background:var(--sage)"></i>Paid: ${gbp(paid)}</span>
        <span><i style="background:var(--ac);opacity:.6"></i>To pay (incl. task est.): ${gbp(due)}</span>
        ${unlinkedEst ? `<span><i style="background:var(--amb)"></i>Unsynced task est.: ${gbp(unlinkedEst)}</span>` : ''}
      </div>
    </div>
    ${syncBanner}
    <div class="stats">
      <div class="stat"><b>${gbp(tot)}</b><span>total budget</span></div>
      <div class="stat"><b>${gbp(projected)}</b><span>projected cost</span></div>
      <div class="stat"><b class="${tot&&remaining<0?'over':''}">${gbp(remaining)}</b><span>left available</span></div>
    </div>
    <div class="stats">
      <div class="stat"><b>${gbp(paid)}</b><span>paid so far</span></div>
      <div class="stat"><b>${gbp(due)}</b><span>to pay</span></div>
      <div class="stat"><b class="${over?'over':''}">${gbp(over)}</b><span>overdue</span></div>
    </div>
    <div class="card"><table><tr><th>Category</th><th>Task Est.</th><th>Paid</th><th>To pay</th></tr>${rows}
    <tr><td><b>Total</b></td><td><b>${gbp(totalEst)}</b></td><td><b>${gbp(paid)}</b></td><td><b>${gbp(due)}</b></td></tr></table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn" data-setbudget>Set total budget</button>
      <button class="btn" data-cats>Manage categories</button>
      <button class="btn" data-rem>Reminder defaults</button>
    </div>
    <div class="sec"><span>To pay</span><small>${gbp(due)}</small></div>${toPay || none}
    <div class="sec"><span>Paid</span><small>${gbp(paid)}</small></div>${done || none}`;
}

function modal(title, fields, onSave, onDel, extraHtml = ''){
  const f = fields.map(x => {
    const v = x.val ?? '';
    if(x.type==='checkbox'){
      return `<label style="display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer;text-transform:none;font-size:14px;color:var(--tx)">
        <input data-k="${x.k}" type="checkbox" ${v?'checked':''}> <span>${esc(x.label)}</span>
      </label>`;
    }
    const inp = x.type==='select' ? `<select data-k="${x.k}">${x.opts.map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select>`
      : x.type==='textarea' ? `<textarea rows="3" data-k="${x.k}">${esc(v)}</textarea>`
      : `<input data-k="${x.k}" type="${x.type||'text'}" ${x.type==='number'?'step="0.01" inputmode="decimal"':''} placeholder="${esc(x.ph||'')}" value="${esc(v)}">`;
    return `<label>${esc(x.label)}</label>${inp}`;
  }).join('');
  $('#sheet').innerHTML = `<h1>${esc(title)}</h1>${f}${extraHtml}<div class="acts"><button class="btn p" id="ok">Save</button>${onDel?'<button class="btn d" id="del">Delete</button>':''}<button class="btn" id="cancel">Cancel</button></div>`;
  $('#modal').classList.add('show');
  $('#cancel').onclick = close;
  const submit = () => {
    const o={};
    $('#sheet').querySelectorAll('[data-k]').forEach(e => {
      o[e.dataset.k] = e.type === 'checkbox' ? e.checked : e.value;
    });
    onSave(o);
    close();
  };
  $('#ok').onclick = submit;
  if(onDel) $('#del').onclick = () => { if(confirm('Delete this item?')){ onDel(); close(); } };
}
let catOpen = false;
const close = () => { catOpen = false; $('#modal').classList.remove('show'); };

    {k:'notes',label:'Notes',type:'textarea',val:t.notes},
    {k:'rdays',label:'Reminder',type:'select',val:String(t.rdays ?? ''),opts:[['','Use default'],['0','On the day'],['1','1 day before'],['2','2 days before'],['7','1 week before'],['14','2 weeks before']]},

  ], async o => {
    if(!o.title.trim()) return;

  modal(n?'New guest':'Edit guest', [
    {k:'name',label:'Guest / Party Name',val:g.name,ph:'e.g. Sarah & Tom'},
    {k:'side',label:'Invited by',type:'select',val:g.side||'',opts:[['','Mutual / Not set'],['bride','Bride'],['groom','Groom']]},
    {k:'size',label:'Number in party (including them)',type:'number',val:g.size||1},
    {k:'invite',label:'Invited to',type:'select',val:g.invite||'day',opts:[['day','Day and evening'],['evening','Evening only']]},
    {k:'rsvp',label:'RSVP Status',type:'select',val:g.rsvp||'pending',opts:[['pending','Pending'],['yes','Attending'],['no','Declined']]},
    {k:'table',label:'Table / Group (optional)',val:g.table,ph:'e.g. Top Table, Table 3'},
    {k:'diet',label:'Dietary requirements / Allergies',val:g.diet,ph:'e.g. Vegetarian, Gluten-free'},
    {k:'notes',label:'Other notes (song request, gifts, etc.)',type:'textarea',val:g.notes}
  ], o => { if(!o.name.trim()) return; save('guests', g.id, {...g, ...o, name:o.name.trim(), size:Math.max(1,parseInt(o.size)||1)}); },
  n ? null : () => remove('guests', g.id));
}

function budgetCapModal(){
  modal('Total Wedding Budget', [
    {k:'budget',label:'Total budget (£)',type:'number',val:st.cfg.budget||''}
  ], o => save('settings','main',{...st.cfg, budget:parseFloat(o.budget)||0}));
}

function settingsModal(){
  modal('Wedding Details', [
    {k:'weddingTitle',label:'Header Title',val:st.cfg.weddingTitle || 'Our Wedding'},
    {k:'weddingDate',label:'Wedding Date',type:'date',val:st.cfg.weddingDate || DEFAULT_WEDDING}
  ], o => save('settings','main',{...st.cfg, weddingTitle:o.weddingTitle.trim()||'Our Wedding', weddingDate:o.weddingDate||DEFAULT_WEDDING}));
}

function exportModal(){
  $('#sheet').innerHTML = `<h1>Export & Backup</h1>
    <p class="m" style="color:var(--mut)">Download your wedding planner data for spreadsheets or safekeeping.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
      <button class="btn" id="dlGuests">Download Guest List (CSV)</button>
      <button class="btn" id="dlBudget">Download Budget & Costs (CSV)</button>
      <button class="btn" id="dlJson">Download Full Backup (JSON)</button>
    </div>
    <div class="acts"><button class="btn" id="cancel">Close</button></div>`;
  $('#modal').classList.add('show');
  $('#cancel').onclick = close;
  const dl = (name, content, mime='text/csv') => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], {type:mime}));
    a.download = name; a.click();
  };
  const csvRow = arr => arr.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',');
  $('#dlGuests').onclick = () => {
    const rows = [csvRow(['Name','Party Size','Side','Invite','RSVP','Table','Dietary','Notes']),
      ...st.guests.map(g => csvRow([g.name, g.size||1, g.side||'', g.invite||'day', g.rsvp||'pending', g.table||'', g.diet||'', g.notes||'']))];
    dl('wedding-guests.csv', rows.join('\n'));
  };
  $('#dlBudget').onclick = () => {
    const rows = [csvRow(['Description','Category','Amount','Status','Date','Linked Task']),
      ...st.exps.map(x => csvRow([x.desc, catName(x.cat), x.amount, isPaid(x)?'Paid':'To pay', xDate(x), (st.tasks.find(t=>t.id===x.taskId)||{}).title||'']))];
    dl('wedding-budget.csv', rows.join('\n'));
  };
  $('#dlJson').onclick = () => dl('wedding-backup.json', JSON.stringify(st, null, 2), 'application/json');
}

function remModal(){
  modal('Reminder defaults', [
    {k:'rdays',label:'Remind me',type:'select',val:String(st.cfg.rdays ?? '1'),opts:[['0','On the day'],['1','1 day before'],['2','2 days before'],['7','1 week before'],['14','2 weeks before']]},
    {k:'rtime',label:'At',type:'time',val:st.cfg.rtime || '09:00'}
  ], o => save('settings','main',{...st.cfg, rdays:o.rdays, rtime:o.rtime || '09:00'}));
}

function catModal(){
  const draw = () => {
    $('#sheet').innerHTML = `<h1>Categories</h1>` + st.cats.map(c => `<div class="row"><input data-cr="${esc(c.id)}" value="${esc(c.name)}"><button class="btn d" data-cd="${esc(c.id)}">✕</button></div>`).join('')
      + `<label>New category</label><input id="newcat" placeholder="e.g. Honeymoon"><div class="acts"><button class="btn p" id="addcat">Add</button><button class="btn" id="cancel">Done</button></div>`;
    $('#cancel').onclick = close;
    $('#addcat').onclick = () => { const v=$('#newcat').value.trim(); if(v) save('categories', null, {name:v}); };
  };
  catOpen = true; draw(); $('#modal').classList.add('show');
  $('#sheet').onchange = e => { const id=e.target.dataset.cr; if(id && e.target.value.trim()) save('categories', id, {name:e.target.value.trim()}); };
  $('#sheet').onclick = e => { const id=e.target.dataset.cd; if(id && confirm('Delete this category? Its tasks become uncategorised.')) remove('categories', id); };
  catModal.redraw = draw;
}

$('#cfgBtn').onclick = settingsModal;
$('#expBtn').onclick = exportModal;

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#modal').classList.contains('show')) close();
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter' && $('#modal').classList.contains('show') && $('#ok')) $('#ok').click();
});

document.addEventListener('click', async e => {
  const t = e.target;
  if(t.id === 'modal'){ close(); return; }
  if(t.dataset.tab){ tab = t.dataset.tab; render(); return; }
  if(t.dataset.rem !== undefined){ remModal(); return; }
  if(t.closest('a.bell') || t.closest('.grip')) return;
  if(t.dataset.limits !== undefined){ e.preventDefault(); limitsModal(); return; }
  if(t.dataset.sfilter){ sfilter = t.dataset.sfilter; render(); return; }
  if(t.dataset.gfilter){ gfilter = t.dataset.gfilter; render(); return; }
  if(t.dataset.dfilter){ dfilter = !dfilter; render(); return; }
  if(t.dataset.syncall !== undefined){
    const list = unlinkedEstTasks();
    for(const tk of list) await syncTaskEstimateToBudget(tk.id, tk, true);
    toast(`Synced ${list.length} task estimate${list.length>1?'s':''} to Budget`);
    return;
  }
  if(t.dataset.sortdate !== undefined){ e.preventDefault(); if(confirm('Reorder all open tasks by due date?')){ st.tasks.filter(x=>!x.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999') || byOrder(a,b)).forEach((x,i)=>{ const {id,...rest}=x; save('tasks', id, {...rest, order:(i+1)*1000}); }); } return; }
  if(t.dataset.paid){ const x = st.exps.find(y=>y.id===t.dataset.paid); if(x){ const {id,...rest}=x; save('expenses', id, {...rest, status:'paid', paidOn:today(), autoEst:false}); toast('Marked as paid'); } return; }
  if(t.dataset.cats !== undefined){ catModal(); return; }
  if(t.dataset.filter){ filter = t.dataset.filter; render(); return; }
  if(t.dataset.hide !== undefined){ e.preventDefault(); hideDone = !hideDone; render(); return; }
  if(t.dataset.toggle){ const k = st.tasks.find(x=>x.id===t.dataset.toggle); if(k){ const {id,...rest}=k; save('tasks', id, {...rest, done:t.checked}); } return; }
  if(t.dataset.setbudget !== undefined){ budgetCapModal(); return; }
  if(t.dataset.rsvp) return;
  const r = t.closest('[data-edit]'); if(r){ taskModal(st.tasks.find(x=>x.id===r.dataset.edit)); return; }
  const xe = t.closest('[data-xedit]'); if(xe){ expModal(st.exps.find(x=>x.id===xe.dataset.xedit)); return; }
  const g = t.closest('[data-gedit]'); if(g){ guestModal(st.guests.find(x=>x.id===g.dataset.gedit)); return; }
});
document.addEventListener('change', e => {
  const id = e.target.dataset.rsvp;
  if(id){ const g = st.guests.find(x=>x.id===id); if(g){ const {id:_,...rest}=g; save('guests', id, {...rest, rsvp:e.target.value}); } }
});
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('.grip'); if(!g) return;
  const row = g.closest('.row'), list = $('#olist'); if(!row || !list) return;
  e.preventDefault();
  try{ document.documentElement.setPointerCapture(e.pointerId); }catch(_){}
  row.classList.add('drag');
  drag = {row, list, pid:e.pointerId, before:[...list.children].map(r => r.dataset.edit).join()};
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  const {row, list} = drag;
  const after = [...list.children].filter(r => r !== row).find(r => { const b = r.getBoundingClientRect(); return e.clientY < b.top + b.height/2; });
  if(after){ if(row.nextElementSibling !== after) list.insertBefore(row, after); }
  else if(list.lastElementChild !== row) list.appendChild(row);
  if(e.clientY < 80) window.scrollBy(0,-10); else if(e.clientY > window.innerHeight - 80) window.scrollBy(0,10);
});
function endDrag(){
  if(!drag) return;
  const {row, list, pid, before} = drag, ids = [...list.children].map(r => r.dataset.edit);
  row.classList.remove('drag'); drag = null;
  try{ document.documentElement.releasePointerCapture(pid); }catch(_){}
  if(ids.join() !== before) commitOrder(ids);
  if(pendingRender){ pendingRender = false; render(); }
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
$('#fab').onclick = () => tab==='tasks' ? taskModal() : tab==='guests' ? guestModal() : expModal();
render();
window.addEventListener('load', connect);
</script>
</body>
</html>
